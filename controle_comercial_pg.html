<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Comercial - P&G</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17212b;--muted:#667085;--primary:#0b63ce;--border:#e4e7ec;--good:#0b8f55;--warn:#b7791f}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#0b63ce,#083b7a);color:#fff;padding:22px 28px}
header h1{margin:0 0 5px;font-size:25px} header p{margin:0;opacity:.88}
.wrap{max-width:1500px;margin:20px auto;padding:0 18px}
.toolbar,.cards,.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 3px 14px rgba(16,24,40,.05)}
.toolbar{padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit} button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--primary);color:#fff;font-weight:600}
button.secondary{background:#eef4fb;color:#124d88} button.danger{background:#c93636} button.gray{background:#667085}
select,input[type=text],input[type=number]{border:1px solid #d0d5dd;border-radius:9px;padding:10px;background:#fff}
.search{min-width:280px;flex:1}
.cards{margin-top:16px;padding:15px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{border:1px solid var(--border);border-radius:12px;padding:14px;background:#fbfcfd}
.card small{display:block;color:var(--muted);margin-bottom:5px}.card strong{font-size:22px}
.tabs{display:flex;gap:8px;margin:18px 0 12px}.tab{background:#e9eef5;color:#344054}.tab.active{background:var(--primary);color:#fff}
.panel{padding:15px;overflow:hidden}
.table-wrap{overflow:auto;max-height:65vh;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:1050px;background:#fff}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;font-size:13px}
th{position:sticky;top:0;background:#eef4fb;z-index:2;color:#344054}
td.num{text-align:right}.status{font-weight:700}.good{color:var(--good)}.warn{color:var(--warn)}
.actions{display:flex;gap:6px}.actions button{padding:6px 9px;font-size:12px}
.footer{color:var(--muted);font-size:12px;margin:12px 0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}.modal-box{background:#fff;border-radius:15px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Controle Comercial — P&G</h1>
  <p>Gestão de clientes, faturamento, positivação, pontos e mecânicas por canal.</p>
</header>
<div class="wrap">
  <div class="toolbar">
    <select id="sheetSelect" onchange="changeSheet()"></select>
    <input id="search" class="search" type="text" placeholder="🔎 Buscar por CNPJ ou nome..." oninput="render()">
    <button onclick="openModal()">+ Novo cliente</button>
    <button class="secondary" onclick="exportCSV()">Exportar CSV</button>
    <button class="gray" onclick="resetData()">Restaurar planilha</button>
    <button class="danger" onclick="clearAllData()">🧹 Limpar dados</button>
  </div>

  <div class="cards">
    <div class="card"><small>Clientes</small><strong id="mClientes">0</strong></div>
    <div class="card"><small>Faturamento</small><strong id="mValor">R$ 0</strong></div>
    <div class="card"><small>Positivação</small><strong id="mPos">0</strong></div>
    <div class="card"><small>FX2 + FX3</small><strong id="mFx">0</strong></div>
    <div class="card"><small>Points</small><strong id="mPoints">0</strong></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="panel">
    <div class="table-wrap">
      <table id="tbl"></table>
    </div>
    <div class="footer">Os dados editados ficam salvos neste navegador (localStorage). Use “Restaurar planilha” para voltar aos dados originais.</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Novo cliente</h2>
    <div class="formgrid" id="formgrid"></div>
    <div class="modal-actions">
      <button class="gray" onclick="closeModal()">Cancelar</button>
      <button onclick="saveClient()">Salvar</button>
    </div>
  </div>
</div>

const KEY = "controle_pg_junho_v1";
let data = JSON.parse(localStorage.getItem(KEY) || "null") || structuredClone(ORIGINAL);
let current = Object.keys(data)[0];
let editIndex = null;

const money = v => "R$ " + (Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = v => Number(v)||0;

function init(){
  const sel=document.getElementById("sheetSelect");
  sel.innerHTML=Object.keys(data).map(s=>`<option>${s}</option>`).join("");
  sel.value=current;
  renderTabs(); render();
}
function changeSheet(){current=document.getElementById("sheetSelect").value;renderTabs();render();}
function renderTabs(){
  document.getElementById("tabs").innerHTML=Object.keys(data).map(s=>`<button class="tab ${s===current?'active':''}" onclick="current='${s}';document.getElementById('sheetSelect').value='${s}';renderTabs();render()">${s}</button>`).join("");
}
function filteredRows(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const rows=data[current].rows;
  if(!q) return rows.map((r,i)=>({r,i}));
  return rows.map((r,i)=>({r,i})).filter(x=>String(x.r[0]).toLowerCase().includes(q)||String(x.r[1]).toLowerCase().includes(q));
}
function render(){
  const obj=data[current], rows=filteredRows();
  let h="<thead><tr>";
  obj.headers.forEach(x=>h+=`<th>${x}</th>`);
  h+="<th>Ações</th></tr></thead><tbody>";
  rows.forEach(({r,i})=>{
    h+="<tr>";
    r.forEach((v,c)=>{
      let cls=(c>=2&&c<=12)?"num":"";
      h+=`<td class="${cls}">${v===""?"":(c===4?money(v):v)}</td>`;
    });
    h+=`<td><div class="actions"><button class="secondary" onclick="openModal(${i})">✏️ Editar cliente</button><button class="danger" onclick="clearClient(${i})">🧹 Limpar dados</button></div></td></tr>`;
  });
  h+="</tbody>";
  document.getElementById("tbl").innerHTML=h;
  updateMetrics();
}
function updateMetrics(){
  const rows=data[current].rows;
  let valor=0,pos=0,fx=0,points=0;
  rows.forEach(r=>{valor+=num(r[4]);pos+=num(r[5]);fx+=num(r[2])+num(r[3]);points+=num(r[8]);});
  document.getElementById("mClientes").textContent=rows.length;
  document.getElementById("mValor").textContent=money(valor);
  document.getElementById("mPos").textContent=pos.toLocaleString("pt-BR");
  document.getElementById("mFx").textContent=fx.toLocaleString("pt-BR");
  document.getElementById("mPoints").textContent=points.toLocaleString("pt-BR");
}
function openModal(index=null){
  editIndex=index;
  const obj=data[current], r=index===null?Array(obj.headers.length).fill(""):obj.rows[index];
  document.getElementById("modalTitle").textContent=index===null?"Novo cliente":"Editar cliente";
  const fg=document.getElementById("formgrid"); fg.innerHTML="";
  obj.headers.forEach((head,i)=>{
    if(i>12) return;
    fg.innerHTML+=`<div class="field"><label>${head||"Campo "+(i+1)}</label><input id="f${i}" type="${i>=2?'number':'text'}" value="${String(r[i]??"").replace(/"/g,'&quot;')}"></div>`;
  });
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show");}
function saveClient(){
  const obj=data[current], r=[];
  for(let i=0;i<13;i++){let el=document.getElementById("f"+i); let v=el?el.value:""; if(i>=2 && v!=="") v=Number(v); r.push(v);}
  if(!r[0] || !r[1]){alert("Informe CNPJ e nome.");return;}
  if(editIndex===null)obj.rows.push(r); else obj.rows[editIndex]=r;
  persist(); closeModal(); render();
}
function clearClient(i){
  const nome = data[current].rows[i]?.[1] || "este cliente";
  if(confirm("Tem certeza que deseja limpar TODOS os dados de " + nome + "?\n\nEsta ação apagará os dados preenchidos deste cliente.")){
    data[current].rows[i] = Array(data[current].headers.length).fill("");
    persist();
    render();
  }
}
function clearAllData(){
  if(confirm("Tem certeza que deseja limpar TODOS os dados preenchidos?\n\nEsta ação apagará os dados de todas as abas e clientes. Os registros permanecerão vazios para novo preenchimento.")){
    Object.values(data).forEach(obj=>{
      obj.rows = obj.rows.map(() => Array(obj.headers.length).fill(""));
    });
    persist();
    render();
  }
}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));}
function resetData(){
  if(confirm("Restaurar todos os dados originais da planilha? As alterações feitas no navegador serão perdidas.")){
    data=structuredClone(ORIGINAL);persist();init();
  }
}
function exportCSV(){
  const obj=data[current];
  const lines=[obj.headers.join(";")];
  obj.rows.forEach(r=>lines.push(r.map(v=>String(v??"").replaceAll("; ",", ")).join(";")));
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=current.toLowerCase()+"_controle.csv";a.click();
}
init();
</script>
